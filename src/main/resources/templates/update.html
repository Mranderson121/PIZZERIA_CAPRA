<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Modifica Pizza</title>
<style>
body {
	font-family: Arial, sans-serif;
	margin: 20px;
}

.error-message {
	color: red;
	margin-bottom: 10px;
	font-weight: bold;
}

.table-container {
	display: flex;
	justify-content: space-between;
	margin-bottom: 20px;
}

table {
	border-collapse: collapse;
	width: 48%;
	margin-bottom: 20px;
}

table, th, td {
	border: 1px solid #ddd;
}

th, td {
	padding: 8px;
	text-align: left;
}

th {
	background-color: #f4f4f4;
}

.form-container {
	display: flex;
	flex-direction: column;
	margin-top: 20px;
}

.form-container input[type="text"], .form-container button {
	padding: 10px;
	margin-top: 10px;
	width: 300px;
	font-size: 14px;
}

.form-container button {
	background-color: #4CAF50;
	color: white;
	border: none;
	cursor: pointer;
}

.form-container button:hover {
	background-color: #45a049;
}
</style>
</head>
<body>

	<h1>Modifica Pizza</h1>

	<form action="#" th:action="@{/updatePizza}" method="post">

		<!-- Hidden field for pizzaId -->
		<input type="hidden" name="pizzaId" th:value="${pizza.idPizza}">

		<div class="table-container">

			<table>
				<caption>
					<strong>Seleziona Impasto</strong>
				</caption>
				<thead>
					<tr>
						<th>Nome Impasto</th>
						<th>Seleziona</th>
					</tr>
				</thead>
				<tbody>
					<!-- Iterate over impasti -->
					<tr th:each="impasto : ${impasti}">
						<td th:text="${impasto.nome}"></td>
						<td><input type="radio" name="impastoId"
							th:value="${impasto.idImpasto}"
							th:checked="${impasto.idImpasto == pizza.impasto.idImpasto}" />
						</td>
					</tr>
				</tbody>
			</table>

			<table>
				<caption>
					<strong>Seleziona Ingredienti</strong>
				</caption>
				<thead>
					<tr>
						<th>Nome Ingrediente</th>
						<th>Seleziona</th>
					</tr>
				</thead>
				<tbody>
					<!-- Iterate over ingredienti -->
					<tr th:each="ingrediente : ${ingredienti}">
						<td th:text="${ingrediente.nome}"></td>
						<td><input type="checkbox" name="ingredientiId"
							th:value="${ingrediente.idIngrediente}"
							th:checked="${#arrays.contains(pizza.ingredienti, ingrediente)}" />
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="form-container">
			<label for="pizzaName">Nome Pizza:</label> <input type="text"
				id="pizzaName" name="pizzaName" th:value="${pizza.nome}" required>

			<button type="submit">Salva Modifiche</button>
		</div>
	</form>
</body>
</html>
